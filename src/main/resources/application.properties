spring.application.name=cartservice
server.port=${PORT:8002}

eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:https://exp2-soa.onrender.com/eureka/}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://exp2-soa.onrender.com/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/skillexp2}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:root}}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
